<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volley Parton</title>
  <meta name="description" content="Volley Parton: pickleball team.">
  <meta property="og:title" content="Volley Parton">
  <meta property="og:description" content="Pickleball team.">
  <meta name="theme-color" content="#000000">
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
    /* the video already shows the name; keep the heading for screen readers and search */
    h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    a { position: fixed; inset: 0; color: #fff; text-decoration: none; }
    .hint { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 16px;
      border-radius: 999px; background: rgba(255,255,255,.15); backdrop-filter: blur(6px); white-space: nowrap;
      font-size: .95rem; }
    a:hover .hint, a:focus-visible .hint { background: rgba(255,255,255,.3); }
    /* sits above the full-screen video link */
    .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1; display: flex; justify-content: space-between;
      align-items: center; gap: 12px; padding: 12px 16px; background: linear-gradient(rgba(0,0,0,.7), transparent); }
    .bar a { position: static; padding: 8px 14px; border-radius: 999px; background: #ff5fa2; font-weight: 600; }
    .bar a:hover, .bar a:focus-visible { background: #ff86b9; }
    .next small { display: block; font-size: .75rem; opacity: .75; text-transform: uppercase; letter-spacing: .08em; }
    .next { text-shadow: 0 1px 6px #000; }
    .next > span { font-variant-numeric: tabular-nums; font-weight: 600; }
    @media (max-width: 480px) { .bar { flex-direction: column; text-align: center; } }
  </style>
</head>
<body>
  <!-- muted + playsinline are required for autoplay on phones -->
  <a href="https://www.facebook.com/share/v/14twi7L9Ywd/" target="_blank" rel="noopener">
    <video src="video.mp4" aria-label="Volley Parton team animation" autoplay muted loop playsinline preload="auto"></video>
    <span class="hint">▶ Watch with music on Facebook</span>
  </a>
  <h1>Volley Parton</h1>
  <div class="bar">
    <div class="next"><small>Next game · <span data-next></span></small><span data-countdown></span></div>
    <a href="about.html">About the team →</a>
  </div>
  <script src="team.js"></script>
</body>
</html>
