name: Update season from league site

on:
  schedule:
    # UTC. Games are 11:30 AM–1 PM Eastern on Saturdays; scores can be entered late.
    - cron: '30 18 * * 6'  # Sat afternoon
    - cron: '30 23 * * 6'  # Sat evening
    - cron: '30 14 * * 0'  # Sun morning, catches stragglers
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-season.mjs
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update season results from league site"
          git push
